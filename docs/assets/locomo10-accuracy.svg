<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title description">
  <title id="title">LoCoMo-10 Judge Accuracy</title>
  <desc id="description">Baseline scored 2.60 percent, Memory scored 73.05 percent, and Memory plus Consolidate scored 77.60 percent across 1,540 questions.</desc>
  <rect width="1200" height="640" rx="24" fill="#f6f4ef"/>
  <text x="76" y="72" fill="#20231f" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="30" font-weight="700">LoCoMo-10 Judge Accuracy</text>
  <text x="76" y="104" fill="#696e67" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16">Category 1–4 · 1,540 questions · one run per mode</text>

  <g stroke="#dedbd2" stroke-width="1">
    <line x1="116" y1="140" x2="1130" y2="140"/>
    <line x1="116" y1="230" x2="1130" y2="230"/>
    <line x1="116" y1="320" x2="1130" y2="320"/>
    <line x1="116" y1="410" x2="1130" y2="410"/>
    <line x1="116" y1="500" x2="1130" y2="500"/>
  </g>
  <g fill="#777b75" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" text-anchor="end">
    <text x="101" y="145">100%</text>
    <text x="101" y="235">75%</text>
    <text x="101" y="325">50%</text>
    <text x="101" y="415">25%</text>
    <text x="101" y="505">0%</text>
  </g>

  <g font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" text-anchor="middle">
    <rect x="214" y="491" width="190" height="9" rx="5" fill="#7c817b"/>
    <text x="309" y="473" fill="#3f443f" font-size="25" font-weight="750">2.60%</text>
    <text x="309" y="540" fill="#20231f" font-size="17" font-weight="650">Baseline</text>
    <text x="309" y="567" fill="#777b75" font-size="14">40 / 1,540 correct</text>

    <rect x="508" y="237" width="190" height="263" rx="9" fill="#247b64"/>
    <text x="603" y="218" fill="#185a49" font-size="25" font-weight="750">73.05%</text>
    <text x="603" y="540" fill="#20231f" font-size="17" font-weight="650">Memory</text>
    <text x="603" y="567" fill="#777b75" font-size="14">1,125 / 1,540 correct</text>

    <rect x="802" y="221" width="190" height="279" rx="9" fill="#b05b37"/>
    <text x="897" y="202" fill="#864127" font-size="25" font-weight="750">77.60%</text>
    <text x="897" y="540" fill="#20231f" font-size="17" font-weight="650">Memory + Consolidate</text>
    <text x="897" y="567" fill="#777b75" font-size="14">1,195 / 1,540 correct</text>
  </g>

  <text x="1124" y="610" fill="#8a8d87" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" text-anchor="end">dsh-memory benchmark · LLM Judge</text>
</svg>
