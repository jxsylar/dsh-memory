<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">dsh-memory Settings structure preview</title>
  <desc id="desc">A structural preview of the Memory settings section with status, Global, Workspaces and Sessions tabs.</desc>
  <rect width="960" height="540" fill="#11131a"/>
  <rect x="36" y="34" width="888" height="472" rx="18" fill="#1b1e28" stroke="#3c4154"/>
  <text x="72" y="82" fill="#f4f5fa" font-family="system-ui,sans-serif" font-size="28" font-weight="700">Memory</text>
  <text x="72" y="108" fill="#aeb4c6" font-family="system-ui,sans-serif" font-size="15">Local Markdown memory managed by the Host</text>
  <rect x="72" y="132" width="816" height="68" rx="10" fill="#252936"/>
  <text x="94" y="160" fill="#eef0f7" font-family="system-ui,sans-serif" font-size="14">Status: Enabled     Global: 124 bytes     Workspaces: 2</text>
  <text x="94" y="184" fill="#aeb4c6" font-family="ui-monospace,monospace" font-size="13">Root: ~/.dsh/memory</text>
  <text x="78" y="240" fill="#c8caf7" font-family="system-ui,sans-serif" font-size="15" font-weight="700">Global</text>
  <text x="162" y="240" fill="#8d93a8" font-family="system-ui,sans-serif" font-size="15">Workspaces</text>
  <text x="278" y="240" fill="#8d93a8" font-family="system-ui,sans-serif" font-size="15">Sessions</text>
  <rect x="72" y="250" width="816" height="1" fill="#3c4154"/>
  <rect x="72" y="250" width="60" height="3" fill="#7777ed"/>
  <text x="72" y="286" fill="#f4f5fa" font-family="system-ui,sans-serif" font-size="14" font-weight="700">GLOBAL.md</text>
  <rect x="72" y="302" width="816" height="132" rx="10" fill="#151821" stroke="#3c4154"/>
  <text x="92" y="332" fill="#c7cce0" font-family="ui-monospace,monospace" font-size="13"># Global Memory</text>
  <text x="92" y="358" fill="#c7cce0" font-family="ui-monospace,monospace" font-size="13">## User Preferences</text>
  <text x="92" y="384" fill="#c7cce0" font-family="ui-monospace,monospace" font-size="13">- Prefer concise Chinese explanations.</text>
  <rect x="708" y="454" width="180" height="34" rx="8" fill="#5b5bd6"/>
  <text x="735" y="476" fill="white" font-family="system-ui,sans-serif" font-size="14" font-weight="700">Save Global Memory</text>
  <text x="72" y="526" fill="#777e93" font-family="system-ui,sans-serif" font-size="12">Structure preview — replace with a verified runtime screenshot before the first public release.</text>
